name: "upload-240-from-my-to-atomgit"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要上传的版本 tag'
        required: true
        default: '2.4.0'
      gh_repo:
        description: 'APK 所在的 GitHub 仓库'
        required: true
        default: 'qldwj/my'

jobs:
  upload:
    name: "上传 Release 资产到 AtomGit"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.event.inputs.gh_repo }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          mkdir -p release_assets
          echo "===== 下载 $REPO 的 Release $TAG 中的 APK ====="
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "*.apk" \
            --dir release_assets
          ls -lh release_assets/
          COUNT=$(ls release_assets/*.apk 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "没有下载到 APK"
            exit 1
          fi
        shell: bash

      - name: Select APK
        run: |
          APK=$(ls release_assets/*.apk | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "APK_NAME=$(basename $APK)" >> $GITHUB_ENV
        shell: bash

      - name: Create AtomGit Tag
        env:
          TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          echo "===== 创建 AtomGit Tag: $TAG ====="
          curl -s -X POST \
            "https://api.atomgit.com/api/v5/repos/qldwi/Kazumi/tags" \
            -H "PRIVATE-TOKEN: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"refs\":\"main\",\"tag_name\":\"$TAG\",\"tag_message\":\"Release $TAG\"}" \
            || echo "Tag 可能已存在，继续"
        shell: bash

      - name: Create AtomGit Release
        env:
          TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          echo "===== 创建 AtomGit Release: $TAG ====="
          HTTP_CODE=$(curl -s -o /tmp/release.json -w "%{http_code}" -X POST \
            "https://api.atomgit.com/api/v5/repos/qldwi/Kazumi/releases" \
            -H "PRIVATE-TOKEN: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\":\"$TAG\",
              \"name\":\"$TAG\",
              \"body\":\"樱花动漫 正式版 $TAG\",
              \"target_commitish\":\"main\",
              \"release_status\":\"latest\"
            }")
          echo "HTTP 状态码: $HTTP_CODE"
          cat /tmp/release.json
        shell: bash

      # ========== 关键修复：用 Python 发 PUT，完整带上所有 OBS header ==========
      - name: Upload APK to AtomGit
        env:
          TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
          APK_PATH: ${{ env.APK_PATH }}
          APK_NAME: ${{ env.APK_NAME }}
        run: |
          # 1. 重新获取 upload_url（每次 PUT 都要重新申请，签名 URL 有有效期）
          curl -s "https://api.atomgit.com/api/v5/repos/qldwi/Kazumi/releases/$TAG/upload_url?file_name=$APK_NAME" \
            -H "PRIVATE-TOKEN: $TOKEN" > /tmp/upload_url.json
          echo "===== upload_url 响应 ====="
          cat /tmp/upload_url.json
          echo

          # 2. 用 Python 完整发送 PUT，带上所有必需 header
          python3 << 'PY'
          import json, os, sys, urllib.request, urllib.error

          with open('/tmp/upload_url.json') as f:
              d = json.load(f)

          url = d.get('url', '')
          if not url:
              print("未获取到上传地址")
              sys.exit(1)

          headers = d.get('headers', {})
          apk_path = os.environ['APK_PATH']

          print(f"上传文件: {apk_path}")
          print(f"文件大小: {os.path.getsize(apk_path)} 字节")
          print("携带 header:")
          for k, v in headers.items():
              display = v if len(v) < 80 else v[:77] + '...'
              print(f"  {k}: {display}")

          with open(apk_path, 'rb') as f:
              data = f.read()

          req = urllib.request.Request(url, data=data, method='PUT')
          for k, v in headers.items():
              req.add_header(k, v)

          try:
              with urllib.request.urlopen(req, timeout=300) as resp:
                  print(f"PUT 状态码: {resp.status}")
                  body = resp.read().decode('utf-8', errors='replace')
                  print("响应内容:", body[:500])
                  print("APK 上传成功")
          except urllib.error.HTTPError as e:
              print(f"PUT 失败，HTTP 状态码: {e.code}")
              print(e.read().decode('utf-8', errors='replace')[:1000])
              sys.exit(1)
          except Exception as e:
              print(f"PUT 异常: {e}")
              sys.exit(1)
          PY
        shell: bash

      - name: Confirm AtomGit release
        env:
          TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          echo "===== 确认 AtomGit Release 状态 ====="
          curl -s "https://api.atomgit.com/api/v5/repos/qldwi/Kazumi/releases/tags/$TAG" \
            -H "PRIVATE-TOKEN: $TOKEN" > /tmp/final.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/final.json'))
          print("名称:", d.get('name'))
          print("状态:", d.get('release_status'))
          print("附件:")
          for a in d.get('assets', []) or []:
              print("  -", a.get('name'), a.get('size'), "字节")
          PY
        shell: bash
