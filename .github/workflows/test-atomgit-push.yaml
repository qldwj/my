name: "test-atomgit-api-release"

on:
  workflow_dispatch:

jobs:
  test-api-release:
    name: "测试 AtomGit API 发布"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create a dummy APK for testing
        run: |
          echo "This is a dummy APK file for API release test." > test-app.apk
          ls -lh test-app.apk

      - name: Create Tag via API
        env:
          TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          echo "===== 1. 创建 Tag ====="
          TAG_NAME="v0.0.0-api-test-$(date +%s)"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          HTTP_CODE=$(curl -s -o /tmp/tag_response.json -w "%{http_code}" -X POST \
            "https://api.atomgit.com/api/v5/repos/qldwi/Kazumi/tags" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"refs\": \"main\",
              \"tag_name\": \"$TAG_NAME\",
              \"tag_message\": \"API test tag\"
            }")

          echo "HTTP 状态码: $HTTP_CODE"
          cat /tmp/tag_response.json

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Tag 创建成功: $TAG_NAME"
          else
            echo "Tag 创建失败"
            exit 1
          fi
        shell: bash

      - name: Upload File via API
        env:
          TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          echo "===== 2. 上传 APK 文件 ====="

          HTTP_CODE=$(curl -s -o /tmp/upload_response.json -w "%{http_code}" -X POST \
            "https://api.atomgit.com/api/v5/repos/qldwi/Kazumi/file/upload?access_token=$TOKEN" \
            -F "file=@test-app.apk")

          echo "HTTP 状态码: $HTTP_CODE"
          cat /tmp/upload_response.json

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "文件上传成功"
          else
            echo "文件上传失败（非阻塞，继续测试 Release）"
          fi
        shell: bash

      - name: Create Release via API
        env:
          TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          echo "===== 3. 创建 Release ====="
          TAG_NAME="${{ env.TAG_NAME }}"

          HTTP_CODE=$(curl -s -o /tmp/release_response.json -w "%{http_code}" -X POST \
            "https://api.atomgit.com/api/v5/repos/qldwi/Kazumi/releases" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"$TAG_NAME\",
              \"name\": \"API Test Release $TAG_NAME\",
              \"body\": \"这是一个通过 GitHub Actions API 创建的测试 Release。\",
              \"target_commitish\": \"main\",
              \"release_status\": \"pre\"
            }")

          echo "HTTP 状态码: $HTTP_CODE"
          cat /tmp/release_response.json

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Release 创建成功"
          else
            echo "Release 创建失败"
            exit 1
          fi
        shell: bash
