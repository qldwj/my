name: "diagnose-releases"

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: List releases in qldwj/Kazumikfc
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "===== qldwj/Kazumikfc 的 Release 列表 ====="
          gh release list --repo qldwj/Kazumikfc --limit 20 || echo "读取失败"
        shell: bash

      - name: List releases in qldwj/my
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "===== qldwj/my 的 Release 列表 ====="
          gh release list --repo qldwj/my --limit 20 || echo "读取失败"
        shell: bash

      - name: List tags in qldwj/Kazumikfc
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "===== qldwj/Kazumikfc 的 Tag 列表 ====="
          gh api repos/qldwj/Kazumikfc/tags --jq '.[].name' || echo "读取失败"
        shell: bash

      - name: List tags in qldwj/my
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "===== qldwj/my 的 Tag 列表 ====="
          gh api repos/qldwj/my/tags --jq '.[].name' || echo "读取失败"
        shell: bash
