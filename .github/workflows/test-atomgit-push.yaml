name: "test-atomgit-push-ssh"

# 用途：验证 ATOMGIT_SSH_KEY 是否能通过 SSH 向 AtomGit 推送。
# 不参与正式发布，只做验证。
#
# 用法：
# GitHub → Actions → test-atomgit-push-ssh → Run workflow
# 跑完看日志，成功会打印「推送成功」和测试分支名。
# 测试完可到 AtomGit 仓库删掉那个 actions-test- 分支。

on:
  workflow_dispatch:

jobs:
  test-push:
    name: "测试 AtomGit SSH 推送"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.ATOMGIT_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "ATOMGIT_SSH_KEY 未配置，请先在仓库 Secrets 里添加私钥"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/atomgit_key
          chmod 600 ~/.ssh/atomgit_key
          ssh-keyscan -t rsa,ed25519 atomgit.com >> ~/.ssh/known_hosts 2>/dev/null || true
          cat >> ~/.ssh/config <<'EOF'
          Host atomgit.com
            HostName atomgit.com
            User git
            IdentityFile ~/.ssh/atomgit_key
            IdentitiesOnly yes
          EOF
          echo "SSH 配置完成"
        shell: bash

      - name: Test SSH connection
        run: |
          echo "===== 测试 SSH 连接 ====="
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -T git@atomgit.com 2>&1 || true
        shell: bash

      - name: Test push via SSH
        run: |
          set -e
          URL="git@atomgit.com:qldwi/Kazumi.git"
          BRANCH="actions-test-$(date +%Y%m%d-%H%M%S)"

          echo "===== 测试 ls-remote ====="
          if ! timeout 30 git ls-remote "$URL" > /tmp/lsremote.out 2>&1; then
            echo "无法访问 AtomGit 仓库，错误输出："
            cat /tmp/lsremote.out
            exit 1
          fi
          echo "仓库可读，远程 refs 数量: $(wc -l < /tmp/lsremote.out)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          echo "AtomGit SSH push test at $(date -u)" > .atomgit-push-test
          git add .atomgit-push-test
          git commit -m "test: verify AtomGit SSH push from GitHub Actions"

          echo "===== 推送到分支: $BRANCH ====="
          export GIT_SSH_COMMAND="ssh -v -o StrictHostKeyChecking=no -o ServerAliveInterval=10"
          if timeout 300 git push --no-thin -v "$URL" "HEAD:refs/heads/$BRANCH"; then
            echo "推送成功，分支: $BRANCH"
            echo "可到 AtomGit 仓库查看该分支，确认后删除"
          else
            RC=$?
            echo "推送失败，退出码: $RC"
            if [ $RC -eq 124 ]; then
              echo "原因：推送超时（300 秒无响应）"
            fi
            exit 1
          fi
        shell: bash
