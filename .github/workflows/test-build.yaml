name: "test-build"

# 用途：只构建 + 签名正式版，APK 发布到当前仓库 qldwj/my 的 GitHub Release。
# 不推 Kazumikfc、不推 AtomGit、不发 Telegram。
# 用于测试构建是否报错。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 2.4.0）'
        required: true
        default: '2.4.0'
      sign_check:
        description: '签名校验 (0=不开启, 1=开启)'
        required: true
        default: '0'

env:
  DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
  DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
  KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
  KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}

jobs:
  build-and-sign:
    name: "测试构建正式版"
    runs-on: "ubuntu-latest"
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set version
        run: |
          echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          echo "raw_version=${{ github.event.inputs.version }}" >> $GITHUB_ENV
        shell: bash

      - name: Sync version to api_endpoints.dart + pubspec.yaml
        run: |
          VERSION="${{ github.event.inputs.version }}"
          FULL_VERSION="${VERSION}"
          FIRST=$(echo $VERSION | awk -F. '{print $1}')
          SECOND=$(echo $VERSION | awk -F. '{print $2}')
          THIRD=$(echo $VERSION | awk -F. '{print $3}')
          FIRST=$(printf "%d" "$FIRST")
          SECOND=$(printf "%02d" "$SECOND")
          THIRD=$(printf "%02d" "$THIRD")
          BUILD_CODE="${FIRST}${SECOND}${THIRD}09"
          sed -i "s/static const String version = '[^']*'/static const String version = '$FULL_VERSION'/" lib/request/config/api_endpoints.dart
          sed -i "s/^version: .*/version: $FULL_VERSION+$BUILD_CODE/" pubspec.yaml
          echo "版本号: $FULL_VERSION (构建号: $BUILD_CODE)"
        shell: bash

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libasound2-dev
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Clean and get Flutter dependencies
        run: |
          flutter clean
          flutter pub cache repair
          rm -f pubspec.lock
          flutter pub get
        shell: bash

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons
        shell: bash

      - name: Remove build id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > yhdm.jks
          if [ ! -s yhdm.jks ]; then
            echo "Keystore 解码失败，请检查 KEYSTORE_BASE64"
            exit 1
          fi
          echo "Keystore 解码成功"
        shell: bash

      - name: Validate keystore (optional)
        run: |
          keytool -list -keystore yhdm.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > /dev/null 2>&1 || {
            echo "Keystore 验证失败，但签名可能仍会成功，继续..."
          }
        shell: bash

      - name: Set signature fingerprint (hardcoded)
        if: ${{ github.event.inputs.sign_check == '1' }}
        run: |
          echo "SIG_P1=8e40a" >> $GITHUB_ENV
          echo "SIG_P2=b9c9" >> $GITHUB_ENV
          echo "SIG_P3=e59ef" >> $GITHUB_ENV
          echo "SIG_P4=da3b" >> $GITHUB_ENV
          echo "SIG_P5=7f7d" >> $GITHUB_ENV
          echo "SIG_P6=bd6a" >> $GITHUB_ENV
          echo "SIG_P7=fe6d" >> $GITHUB_ENV
          echo "SIG_P8=c2c1" >> $GITHUB_ENV
          echo "SIG_P9=0821" >> $GITHUB_ENV
          echo "SIG_P10=6e6" >> $GITHUB_ENV
          echo "SIG_P11=2964" >> $GITHUB_ENV
          echo "SIG_P12=1d1" >> $GITHUB_ENV
          echo "SIG_P13=6aa7" >> $GITHUB_ENV
          echo "SIG_P14=3a576" >> $GITHUB_ENV
          echo "SIG_P15=9ba" >> $GITHUB_ENV
          echo "SIG_P16=ee62" >> $GITHUB_ENV
          echo "签名指纹已拆分为 16 段不等长注入"
        shell: bash

      - name: Build Flutter for Android
        run: >
          flutter build apk --split-per-abi
          --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
          --dart-define=KAZUMI_APPID=$KAZUMI_APPID
          --dart-define=KAZUMI_KEY=$KAZUMI_KEY
          ${{ github.event.inputs.sign_check == '1' && '--dart-define=SIGNATURE_CHECK=true --dart-define=SIG_P1=$SIG_P1 --dart-define=SIG_P2=$SIG_P2 --dart-define=SIG_P3=$SIG_P3 --dart-define=SIG_P4=$SIG_P4 --dart-define=SIG_P5=$SIG_P5 --dart-define=SIG_P6=$SIG_P6 --dart-define=SIG_P7=$SIG_P7 --dart-define=SIG_P8=$SIG_P8 --dart-define=SIG_P9=$SIG_P9 --dart-define=SIG_P10=$SIG_P10 --dart-define=SIG_P11=$SIG_P11 --dart-define=SIG_P12=$SIG_P12 --dart-define=SIG_P13=$SIG_P13 --dart-define=SIG_P14=$SIG_P14 --dart-define=SIG_P15=$SIG_P15 --dart-define=SIG_P16=$SIG_P16' || '' }}
        shell: bash

      - name: Sign APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner"
          $APKSIGNER sign \
            --ks yhdm.jks \
            --ks-pass pass:"$KEYSTORE_PASS" \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:"$KEY_PASS" \
            --out YHDM_android_${{ env.tag }}.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        shell: bash

      - name: Verify signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner"
          $APKSIGNER verify YHDM_android_${{ env.tag }}.apk
        shell: bash

      # ========== 发布到当前仓库 qldwj/my 的 GitHub Release ==========
      - name: Release to qldwj/my
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          TAG: ${{ env.tag }}
        run: |
          echo "发布到 qldwj/my，tag: $TAG"
          # 覆盖同名 tag
          if gh release view "$TAG" --repo qldwj/my &>/dev/null; then
            echo "Tag $TAG 已存在，删除重建..."
            gh release delete "$TAG" --repo qldwj/my -y
            git push --delete https://x-access-token:${GH_TOKEN}@github.com/qldwj/my.git "$TAG" 2>/dev/null || true
            sleep 2
          fi
          gh release create "$TAG" \
            --repo qldwj/my \
            --title "v$TAG 测试构建" \
            --notes "测试构建 v$TAG，仅用于本地验证，非正式发布。" \
            YHDM_android_${{ env.tag }}.apk
        shell: bash
