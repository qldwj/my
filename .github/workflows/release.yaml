name: "build"

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 2.2.2)'
        required: true
        default: '2.2.2'
      sign_check:
        description: '签名校验 (0=不开启, 1=开启)'
        required: true
        default: '0'

env:
  DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
  DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
  KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
  KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}

jobs:
  build-and-sign:
    name: "构建并签名"
    runs-on: "ubuntu-latest"
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set version
        run: echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_ENV
        shell: bash

      - name: Sync version to api_endpoints.dart + pubspec.yaml
        run: |
          VERSION="${{ github.event.inputs.version }}"
          FIRST=$(echo $VERSION | awk -F. '{print $1}')
          SECOND=$(echo $VERSION | awk -F. '{print $2}')
          THIRD=$(echo $VERSION | awk -F. '{print $3}')
          BUILD_CODE="${FIRST}0${SECOND}0${THIRD}0"
          sed -i "s/static const String version = '[^']*'/static const String version = '$VERSION'/" lib/request/config/api_endpoints.dart
          sed -i "s/^version: .*/version: $VERSION+$BUILD_CODE/" pubspec.yaml
          echo "✅ 版本号已同步: $VERSION (构建号: $BUILD_CODE)"
        shell: bash

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libasound2-dev
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons
        shell: bash

      - name: Remove build id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt

      # ========== keystore 解码（签名必用） ==========
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > yhdm.jks
          if [ ! -s yhdm.jks ]; then
            echo "❌ Keystore 解码失败，请检查 KEYSTORE_BASE64"
            exit 1
          fi
          echo "✅ Keystore 解码成功"
        shell: bash

      # 可选：验证 keystore（不需要密码也能验证结构，但为了保险可保留）
      - name: Validate keystore (optional)
        run: |
          keytool -list -keystore yhdm.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > /dev/null 2>&1 || {
            echo "⚠️ Keystore 验证失败，但签名可能仍会成功，继续..."
          }
        shell: bash

      # ========== 关键修改：直接硬编码 SHA256 指纹 ==========
      - name: Set signature fingerprint (hardcoded)
        if: ${{ github.event.inputs.sign_check == '1' }}
        run: |
          # 这里直接写入您提供的指纹
          echo "EXPECTED_SIGNATURE_SHA256=bd447520c59668c3a084879a4834bf23f0ffb1c38a9eb0e6c3418c69fe7a88c2" >> $GITHUB_ENV
          echo "🔑 使用硬编码签名指纹: bd447520c59668c3a084879a4834bf23f0ffb1c38a9eb0e6c3418c69fe7a88c2"
        shell: bash

      - name: Build Flutter for Android
        run: >
          flutter build apk --split-per-abi
          --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
          --dart-define=KAZUMI_APPID=$KAZUMI_APPID
          --dart-define=KAZUMI_KEY=$KAZUMI_KEY
          ${{ github.event.inputs.sign_check == '1' && '--dart-define=SIGNATURE_CHECK=true --dart-define=EXPECTED_SIGNATURE_SHA256=$EXPECTED_SIGNATURE_SHA256' || '' }}
        shell: bash

      - name: Sign APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner"
          $APKSIGNER sign \
            --ks yhdm.jks \
            --ks-pass pass:"$KEYSTORE_PASS" \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:"$KEY_PASS" \
            --out YHDM_android_${{ env.tag }}.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        shell: bash

      - name: Verify signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner"
          $APKSIGNER verify YHDM_android_${{ env.tag }}.apk
        shell: bash

      - name: Create Release in current repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.tag }}"
          if gh release view $TAG &>/dev/null; then
            gh release delete $TAG -y
            git push --delete origin $TAG 2>/dev/null || true
            sleep 2
          fi
          gh release create $TAG \
            --title "v$TAG" \
            --notes "樱花动漫 v$TAG（已签名，可下载修改后发布）" \
            YHDM_android_$TAG.apk
        shell: bash
