name: "build-release" # 正式版构建

# 正式版流程：
# 1. 构建 Flutter APK 并签名
# 2. 发布到 GitHub 正式仓库 qldwj/Kazumikfc（含 APK 附件）
# 3. 在 AtomGit 仓库 qldwi/Kazumi 创建 Tag 和 Release（不含附件，APK 手动上传）
# 4. 发送 Telegram 通知（多行格式，无表情符号）
#
# 构建号规则：主版本 1 位 + 次版本 2 位补零 + 修订号 2 位补零 + 类型 2 位
# 正式版类型为 09，测试版为 00。
# 例如 2.3.9 → 正式版 2030909，测试版 2030900。
#
# 需要的 Secrets：
# - DANDANAPI_APPID / DANDANAPI_KEY
# - KAZUMI_APPID / KAZUMI_KEY
# - KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS
# - PAT_TOKEN（GitHub 个人令牌，用于在 Kazumikfc 创建 Release）
# - ATOMGIT_TOKEN（AtomGit 访问令牌，用于创建 Tag 和 Release）
# - TG_BOT_TOKEN / TG_CHAT_ID（Telegram 通知）

on:
  workflow_dispatch:
    inputs:
      version:
        description: '正式版版本号（如 2.4.3）'
        required: true
        default: '2.4.3'
      sign_check:
        description: '签名校验 (0=不开启, 1=开启)'
        required: true
        default: '0'

env:
  DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
  DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
  KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
  KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}

jobs:
  build-and-sign:
    name: "构建正式版并签名"
    runs-on: "ubuntu-latest"
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set version
        run: |
          echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          echo "raw_version=${{ github.event.inputs.version }}" >> $GITHUB_ENV
        shell: bash

      - name: Sync version to api_endpoints.dart + pubspec.yaml
        # 正式版版本号无后缀，构建号末尾 09。
        # 例如 2.3.9 → 版本号 2.3.9，构建号 2030909。
        run: |
          VERSION="${{ github.event.inputs.version }}"
          FULL_VERSION="${VERSION}"
          FIRST=$(echo $VERSION | awk -F. '{print $1}')
          SECOND=$(echo $VERSION | awk -F. '{print $2}')
          THIRD=$(echo $VERSION | awk -F. '{print $3}')
          # 补零对齐：次版本和修订号各占 2 位
          # --- 构建号规则（固定 9 位）---
          # 主2 + 次2 + 修2 + 渠道3 = 9 字符；渠道：正式 092 / 验证 091 / 测试 090
          # Android versionCode 只能存整数，前导 0 自动去掉（2.4.1 正式 = 020401092 -> 20401092）
          # 同版本下 正式 > 验证 > 测试，跨版本单调递增，覆盖安装方向永远正确
          FIRST=$(printf "%02d" "$FIRST")
          SECOND=$(printf "%02d" "$SECOND")
          THIRD=$(printf "%02d" "$THIRD")
          BUILD_CODE_PAD="${FIRST}${SECOND}${THIRD}092"
          BUILD_CODE=$((10#$BUILD_CODE_PAD))
          sed -i "s/static const String version = '[^']*'/static const String version = '$FULL_VERSION'/" lib/request/config/api_endpoints.dart
          sed -i "s/^version: .*/version: $FULL_VERSION+$BUILD_CODE/" pubspec.yaml
          echo "正式版版本号已同步: $FULL_VERSION (构建号: $BUILD_CODE)"
        shell: bash

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libasound2-dev
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Clean and get Flutter dependencies
        run: |
          flutter clean
          flutter pub cache repair
          rm -f pubspec.lock
          flutter pub get
        shell: bash

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons
        shell: bash

      - name: Remove build id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt

      # ========== keystore 解码（签名必用） ==========
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > yhdm.jks
          if [ ! -s yhdm.jks ]; then
            echo "Keystore 解码失败，请检查 KEYSTORE_BASE64"
            exit 1
          fi
          echo "Keystore 解码成功"
        shell: bash

      - name: Validate keystore (optional)
        run: |
          keytool -list -keystore yhdm.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > /dev/null 2>&1 || {
            echo "Keystore 验证失败，但签名可能仍会成功，继续..."
          }
        shell: bash

      # ========== 签名指纹 16 段注入 ==========
      - name: Set signature fingerprint (hardcoded)
        if: ${{ github.event.inputs.sign_check == '1' }}
        run: |
          echo "SIG_P1=8e40a" >> $GITHUB_ENV
          echo "SIG_P2=b9c9" >> $GITHUB_ENV
          echo "SIG_P3=e59ef" >> $GITHUB_ENV
          echo "SIG_P4=da3b" >> $GITHUB_ENV
          echo "SIG_P5=7f7d" >> $GITHUB_ENV
          echo "SIG_P6=bd6a" >> $GITHUB_ENV
          echo "SIG_P7=fe6d" >> $GITHUB_ENV
          echo "SIG_P8=c2c1" >> $GITHUB_ENV
          echo "SIG_P9=0821" >> $GITHUB_ENV
          echo "SIG_P10=6e6" >> $GITHUB_ENV
          echo "SIG_P11=2964" >> $GITHUB_ENV
          echo "SIG_P12=1d1" >> $GITHUB_ENV
          echo "SIG_P13=6aa7" >> $GITHUB_ENV
          echo "SIG_P14=3a576" >> $GITHUB_ENV
          echo "SIG_P15=9ba" >> $GITHUB_ENV
          echo "SIG_P16=ee62" >> $GITHUB_ENV
          echo "签名指纹已拆分为 16 段不等长注入"
        shell: bash

      - name: Build Flutter for Android
        run: >
          flutter build apk --split-per-abi
          --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
          --dart-define=KAZUMI_APPID=$KAZUMI_APPID
          --dart-define=KAZUMI_KEY=$KAZUMI_KEY
          ${{ github.event.inputs.sign_check == '1' && '--dart-define=SIGNATURE_CHECK=true --dart-define=SIG_P1=$SIG_P1 --dart-define=SIG_P2=$SIG_P2 --dart-define=SIG_P3=$SIG_P3 --dart-define=SIG_P4=$SIG_P4 --dart-define=SIG_P5=$SIG_P5 --dart-define=SIG_P6=$SIG_P6 --dart-define=SIG_P7=$SIG_P7 --dart-define=SIG_P8=$SIG_P8 --dart-define=SIG_P9=$SIG_P9 --dart-define=SIG_P10=$SIG_P10 --dart-define=SIG_P11=$SIG_P11 --dart-define=SIG_P12=$SIG_P12 --dart-define=SIG_P13=$SIG_P13 --dart-define=SIG_P14=$SIG_P14 --dart-define=SIG_P15=$SIG_P15 --dart-define=SIG_P16=$SIG_P16' || '' }}
        shell: bash

      - name: Sign APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner"
          $APKSIGNER sign \
            --ks yhdm.jks \
            --ks-pass pass:"$KEYSTORE_PASS" \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:"$KEY_PASS" \
            --out YHDM_android_${{ env.tag }}.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        shell: bash

      - name: Verify signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner"
          $APKSIGNER verify YHDM_android_${{ env.tag }}.apk
        shell: bash

      # ========== 发布到 App 读取的正式仓库（GitHub: qldwj/Kazumikfc） ==========
      - name: Release to Kazumikfc (GitHub)
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TAG="${{ env.tag }}"
          REPO="qldwj/Kazumikfc"
          # 覆盖同名正式 tag
          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            echo "Tag $TAG 已存在，删除重建..."
            gh release delete "$TAG" --repo "$REPO" -y
            git push --delete https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git "$TAG" 2>/dev/null || true
            sleep 2
          fi
          # 正式 release：不加 --prerelease，正式通道 latest 会返回它
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "v$TAG" \
            --notes "樱花动漫 正式版 v$TAG" \
            YHDM_android_${{ env.tag }}.apk
        shell: bash

      # ========== 在 AtomGit 创建 Tag 和 Release（不含附件） ==========
      #
      # 说明：AtomGit 服务端对来自 GitHub Actions 的大文件上传会卡死，
      # 因此这里只创建 Tag 和 Release，APK 由你手动上传到 AtomGit 网页。
      #
      # AtomGit 仓库: qldwi/Kazumi
      # Secret: ATOMGIT_TOKEN（AtomGit 访问令牌）

      - name: Create AtomGit Tag
        env:
          TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          TAG: ${{ env.tag }}
        run: |
          echo "===== 创建 AtomGit Tag: $TAG ====="
          HTTP_CODE=$(curl -s -o /tmp/atomgit_tag.json -w "%{http_code}" -X POST \
            "https://api.atomgit.com/api/v5/repos/qldwi/Kazumi/tags" \
            -H "PRIVATE-TOKEN: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"refs\":\"main\",\"tag_name\":\"$TAG\",\"tag_message\":\"Release $TAG\"}")
          echo "HTTP 状态码: $HTTP_CODE"
          cat /tmp/atomgit_tag.json
          # Tag 已存在也继续，不算失败
        shell: bash

      - name: Create AtomGit Release
        env:
          TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          TAG: ${{ env.tag }}
        run: |
          echo "===== 创建 AtomGit Release: $TAG ====="
          HTTP_CODE=$(curl -s -o /tmp/atomgit_release.json -w "%{http_code}" -X POST \
            "https://api.atomgit.com/api/v5/repos/qldwi/Kazumi/releases" \
            -H "PRIVATE-TOKEN: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\":\"$TAG\",
              \"name\":\"$TAG\",
              \"body\":\"樱花动漫 正式版 $TAG\",
              \"target_commitish\":\"main\",
              \"release_status\":\"latest\"
            }")
          echo "HTTP 状态码: $HTTP_CODE"
          cat /tmp/atomgit_release.json
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "AtomGit Release 创建成功（未含附件，请手动上传 APK）"
          else
            echo "AtomGit Release 创建失败（可能已存在）"
          fi
        shell: bash

      # ========== 发送 Telegram 通知（多行格式，无表情符号） ==========
      - name: Send Telegram notification
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          VERSION: ${{ env.tag }}
        run: |
          MESSAGE=$(printf '樱花动漫 v%s 发布成功！\n\nGitHub：https://github.com/qldwj/Kazumikfc/releases/download/%s/YHDM_android_%s.apk\nGitCode：https://gitcode.com/qldwi/kazumi/releases/%s\n发布页：https://github.com/qldwj/Kazumikfc/releases/tag/%s' "$VERSION" "$VERSION" "$VERSION" "$VERSION" "$VERSION")
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
        shell: bash
